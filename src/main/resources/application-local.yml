spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/bautruc_ecommerce}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
  jpa:
    show-sql: false
    properties:
      hibernate:
        format_sql: true

logging:
  pattern:
    level: "%5p [correlationId=%X{correlationId:-}]"
