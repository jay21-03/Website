AWSTemplateFormatVersion: "2010-09-09"
Description: CloudFront CDN for existing private Bau Truc Dev S3 bucket.

Parameters:
  BucketName:
    Type: String
    Default: shopbautruc-product-images-dev
  ManageBucketPolicy:
    Type: String
    Default: "false"
    AllowedValues: ["true", "false"]
    Description: Set true only after confirming the existing bucket has no policy. CloudFormation replaces the entire bucket policy.

Conditions:
  CreateBucketPolicy: !Equals [!Ref ManageBucketPolicy, "true"]

Resources:
  ImagesOAC:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub "bautruc-dev-images-${AWS::AccountId}"
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4
        Description: Private Dev S3 media access

  ImagesDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Comment: Bau Truc Dev image CDN
        Enabled: true
        IPV6Enabled: true
        HttpVersion: http2
        PriceClass: PriceClass_100
        Origins:
          - Id: DevImagesS3Origin
            DomainName: !Sub "${BucketName}.s3.ap-southeast-1.amazonaws.com"
            OriginAccessControlId: !Ref ImagesOAC
            S3OriginConfig:
              OriginAccessIdentity: ""
        DefaultCacheBehavior:
          TargetOriginId: DevImagesS3Origin
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [GET, HEAD]
          CachedMethods: [GET, HEAD]
          Compress: true
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6
        ViewerCertificate:
          CloudFrontDefaultCertificate: true

  ImagesBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Condition: CreateBucketPolicy
    Properties:
      Bucket: !Ref BucketName
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: AllowDevImagesCloudFrontReadOnly
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource:
              - !Sub "arn:${AWS::Partition}:s3:::${BucketName}/products/*"
              - !Sub "arn:${AWS::Partition}:s3:::${BucketName}/site/*"
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub "arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/${ImagesDistribution}"

Outputs:
  DistributionId:
    Value: !Ref ImagesDistribution
  PublicBaseUrl:
    Value: !Sub "https://${ImagesDistribution.DomainName}"
