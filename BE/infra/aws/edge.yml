AWSTemplateFormatVersion: "2010-09-09"
Description: >
  Bau Truc production edge stack:
  private frontend S3 bucket, CloudFront OAC, SPA rewrite,
  and same-origin /api/* routing to Elastic Beanstalk.

Parameters:
  Environment:
    Type: String
    Default: prod
    AllowedValues:
      - staging
      - prod

  BackendOriginDomainName:
    Type: String
    Description: >
      Actual Elastic Beanstalk environment CNAME returned by
      describe-environments. Do not use EndpointURL for a SingleInstance
      environment. Do not include http:// or https://.

  PriceClass:
    Type: String
    Default: PriceClass_200
    AllowedValues:
      - PriceClass_100
      - PriceClass_200
      - PriceClass_All

Resources:
  FrontendBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      Tags:
        - Key: Application
          Value: bautruc-ecommerce
        - Key: Environment
          Value: !Ref Environment

  FrontendOriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub "bautruc-${Environment}-frontend-oac"
        Description: Signed CloudFront access to the private frontend bucket
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  SpaRewriteFunction:
    Type: AWS::CloudFront::Function
    Properties:
      Name: !Sub "bautruc-${Environment}-spa-rewrite"
      AutoPublish: true
      FunctionConfig:
        Comment: Rewrite extensionless React Router paths to /index.html
        Runtime: cloudfront-js-2.0
      FunctionCode: |
        function handler(event) {
          var request = event.request;
          var uri = request.uri;

          if (
            uri === '/api' ||
            uri.indexOf('/api/') === 0 ||
            uri === '/actuator' ||
            uri.indexOf('/actuator/') === 0
          ) {
            return request;
          }

          var lastSegment = uri.substring(uri.lastIndexOf('/') + 1);

          if (uri === '/' || lastSegment.indexOf('.') === -1) {
            request.uri = '/index.html';
          }

          return request;
        }

  MainDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Comment: !Sub "Bau Truc main website (${Environment})"
        Enabled: true
        HttpVersion: http2and3
        IPV6Enabled: true
        PriceClass: !Ref PriceClass
        DefaultRootObject: index.html

        Origins:
          - Id: FrontendS3Origin
            DomainName: !GetAtt FrontendBucket.RegionalDomainName
            OriginAccessControlId: !Ref FrontendOriginAccessControl
            S3OriginConfig: {}

          - Id: BackendElasticBeanstalkOrigin
            DomainName: !Ref BackendOriginDomainName
            CustomOriginConfig:
              HTTPPort: 80
              HTTPSPort: 443
              OriginProtocolPolicy: http-only
              OriginReadTimeout: 60

        DefaultCacheBehavior:
          TargetOriginId: FrontendS3Origin
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods:
            - GET
            - HEAD
            - OPTIONS
          CachedMethods:
            - GET
            - HEAD
            - OPTIONS
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6
          Compress: true
          FunctionAssociations:
            - EventType: viewer-request
              FunctionARN: !GetAtt SpaRewriteFunction.FunctionARN

        CacheBehaviors:
          - PathPattern: /api/*
            TargetOriginId: BackendElasticBeanstalkOrigin
            ViewerProtocolPolicy: redirect-to-https
            AllowedMethods:
              - GET
              - HEAD
              - OPTIONS
              - PUT
              - POST
              - PATCH
              - DELETE
            CachedMethods:
              - GET
              - HEAD
              - OPTIONS
            CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad
            OriginRequestPolicyId: b689b0a8-53d0-40ab-baf2-68738e2966ac
            Compress: false

          - PathPattern: /actuator/health
            TargetOriginId: BackendElasticBeanstalkOrigin
            ViewerProtocolPolicy: redirect-to-https
            AllowedMethods:
              - GET
              - HEAD
              - OPTIONS
            CachedMethods:
              - GET
              - HEAD
              - OPTIONS
            CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad
            OriginRequestPolicyId: b689b0a8-53d0-40ab-baf2-68738e2966ac
            Compress: false

        ViewerCertificate:
          CloudFrontDefaultCertificate: true

      Tags:
        - Key: Application
          Value: bautruc-ecommerce
        - Key: Environment
          Value: !Ref Environment

  FrontendBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref FrontendBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: AllowCloudFrontReadOnly
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action:
              - s3:GetObject
            Resource:
              !Sub "${FrontendBucket.Arn}/*"
            Condition:
              StringEquals:
                AWS:SourceArn:
                  !Sub "arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/${MainDistribution}"

Outputs:
  FrontendBucketName:
    Description: Upload FE/dist contents to this private S3 bucket.
    Value: !Ref FrontendBucket

  DistributionId:
    Value: !Ref MainDistribution

  DistributionDomainName:
    Value: !GetAtt MainDistribution.DomainName

  FrontendBaseUrl:
    Description: Use this for FRONTEND_BASE_URL and ALLOWED_ORIGINS.
    Value:
      !Sub "https://${MainDistribution.DomainName}"
