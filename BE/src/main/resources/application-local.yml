spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/bautruc_ecommerce}
    username: ${DB_USERNAME:bautruc}
    password: ${DB_PASSWORD:bautruc_local}
  jpa:
    show-sql: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration

logging:
  pattern:
    level: "%5p [correlationId=%X{correlationId:-}]"

bautruc:
  scheduling:
    enabled: false
  local-storage:
    root: ${LOCAL_OBJECT_STORAGE_ROOT:/var/lib/bautruc/objects}
    public-base-url: ${LOCAL_OBJECT_STORAGE_PUBLIC_BASE_URL:http://127.0.0.1:8080/local-media}
  frontend-base-url: ${FRONTEND_BASE_URL:http://127.0.0.1:3000}
  allowed-origins: ${ALLOWED_ORIGINS:http://127.0.0.1:3000}
  jwt:
    secret-base64: ${JWT_SECRET_BASE64}
