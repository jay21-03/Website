spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/bautruc_ecommerce}
    username: ${DB_USERNAME:bautruc}
    password: ${DB_PASSWORD:bautruc_local}
  jpa:
    show-sql: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration

logging:
  pattern:
    level: "%5p [correlationId=%X{correlationId:-}]"

bautruc:
  frontend-base-url: ${FRONTEND_BASE_URL:http://localhost:3000}
  allowed-origins: ${ALLOWED_ORIGINS:http://localhost:3000}
  jwt:
    secret-base64: ${JWT_SECRET_BASE64}
