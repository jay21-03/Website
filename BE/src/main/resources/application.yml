spring:
  application:
    name: bautruc-ecommerce
  servlet:
    multipart:
      max-file-size: ${MULTIPART_MAX_FILE_SIZE:6MB}
      max-request-size: ${MULTIPART_MAX_REQUEST_SIZE:6MB}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${SERVER_PORT:8080}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true

bautruc:
  reporting:
    dashboard-size: ${DASHBOARD_SIZE:10}
  notification:
    sse-timeout-ms: ${NOTIFICATION_SSE_TIMEOUT_MS:1800000}
  frontend-base-url: ${FRONTEND_BASE_URL:http://localhost:5173}
  allowed-origins: ${ALLOWED_ORIGINS:http://localhost:5173}
  google-client-id: ${GOOGLE_CLIENT_ID:}
  admin-emails: ${ADMIN_EMAILS:}
  jwt:
    algorithm: HS256
    secret-base64: ${JWT_SECRET_BASE64:}
    issuer: ${JWT_ISSUER:bautruc-ecommerce}
    ttl-seconds: ${JWT_TTL_SECONDS:7200}
  payos:
    client-id: ${PAYOS_CLIENT_ID:}
    api-key: ${PAYOS_API_KEY:}
    checksum-key: ${PAYOS_CHECKSUM_KEY:}
    base-url: ${PAYOS_BASE_URL:https://api-merchant.payos.vn}
  aws:
    region: ${AWS_REGION:}
    s3:
      bucket-name: ${S3_BUCKET_NAME:}
      public-base-url: ${S3_PUBLIC_BASE_URL:}
  image:
    max-bytes: ${IMAGE_MAX_BYTES:5242880}
  inventory:
    default-low-stock-threshold: ${INVENTORY_DEFAULT_LOW_STOCK_THRESHOLD:5}
  auth:
    cookie-domain: ${AUTH_COOKIE_DOMAIN:}
