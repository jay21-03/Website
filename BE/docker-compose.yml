name: website

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-bautruc_ecommerce}
      POSTGRES_USER: ${DB_USERNAME:-bautruc}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-bautruc_local}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  backend:
    build:
      context: .
      dockerfile: Dockerfile

    restart: unless-stopped

    depends_on:
      postgres:
        condition: service_healthy

    environment:
      SPRING_PROFILES_ACTIVE: local
      SERVER_PORT: 8080

      # PostgreSQL
      DB_URL: jdbc:postgresql://postgres:5432/${LOCAL_CLONE_DB_NAME:-bautruc_ecommerce}
      DB_USERNAME: ${DB_USERNAME:-bautruc}
      DB_PASSWORD: ${DB_PASSWORD:-bautruc_local}

      # JWT
      JWT_SECRET_BASE64: ${JWT_SECRET_BASE64:?JWT_SECRET_BASE64 is required}
      JWT_ISSUER: ${JWT_ISSUER:-bautruc-ecommerce}
      JWT_TTL_SECONDS: ${JWT_TTL_SECONDS:-7200}

      # Google
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}

      # Admin
      ADMIN_EMAILS: ${ADMIN_EMAILS:-}

      # Frontend / CORS
      FRONTEND_BASE_URL: ${FRONTEND_BASE_URL:-http://127.0.0.1:3000}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://127.0.0.1:3000}

      # payOS
      PAYOS_CLIENT_ID: ${PAYOS_CLIENT_ID:-}
      PAYOS_API_KEY: ${PAYOS_API_KEY:-}
      PAYOS_CHECKSUM_KEY: ${PAYOS_CHECKSUM_KEY:-}
      PAYOS_BASE_URL: http://127.0.0.1:9

      # Keep AWS SDK credential discovery disabled in local containers.
      AWS_EC2_METADATA_DISABLED: "true"
      IMAGE_MAX_BYTES: ${IMAGE_MAX_BYTES:-5242880}

      # Cookie
      AUTH_COOKIE_DOMAIN: ${AUTH_COOKIE_DOMAIN:-}

      # Timezone
      JAVA_TOOL_OPTIONS: ${JAVA_TOOL_OPTIONS:--Duser.timezone=Asia/Ho_Chi_Minh}

    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./local-object-storage:/var/lib/bautruc/objects

volumes:
  postgres_data:
