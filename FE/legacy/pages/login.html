<!doctype html><html lang="vi"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Đăng nhập — Đàng Xem</title><link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@300;400;500;600&family=Playfair+Display:wght@500;600&display=swap" rel="stylesheet"><link rel="stylesheet" href="../assets/css/main.css"></head><body data-page="login" data-root=".."><div id="appHeader"></div><main class="auth-page"><section class="auth-card"><span class="kicker" data-i18n="account">Tài khoản</span><h1 data-i18n="login">Đăng nhập</h1><p data-i18n="loginHint">Theo dõi đơn hàng và lưu sản phẩm yêu thích.</p><form id="loginForm" class="stack-form"><label>Email<input type="email" id="loginEmail" required placeholder="name@email.com"></label><label><span data-i18n="password">Mật khẩu</span><input type="password" required minlength="6" placeholder="••••••••"></label><div class="form-row"><label class="check"><input type="checkbox"> <span data-i18n="remember">Ghi nhớ tôi</span></label><a href="#" data-i18n="forgot">Quên mật khẩu?</a></div><button class="button dark" data-i18n="login">Đăng nhập</button><button type="button" class="button light">G&nbsp; Tiếp tục với Google</button></form><p class="auth-switch"><span data-i18n="noAccount">Chưa có tài khoản?</span> <button id="toggleRegister" data-i18n="register">Đăng ký</button></p></section></main><div id="appFooter"></div><script src="../assets/js/app.js"></script></body></html>
