<!doctype html><html lang="vi"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Thanh toán — Đàng Xem</title><link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@300;400;500;600&family=Playfair+Display:wght@500;600&display=swap" rel="stylesheet"><link rel="stylesheet" href="../assets/css/main.css"></head><body data-page="checkout" data-root=".."><div id="appHeader"></div><main class="page checkout-page"><div class="page-title"><span class="kicker" data-i18n="checkout">Thanh toán</span><h1 data-i18n="orderForm">Thông tin đặt hàng</h1></div><div class="checkout-grid"><form id="orderForm" class="checkout-form"><h3>1. <span data-i18n="deliveryInfo">Thông tin giao hàng</span></h3><div class="form-grid"><label><span data-i18n="fullName">Họ và tên</span><input required name="name"></label><label><span data-i18n="phone">Số điện thoại</span><input required name="phone" inputmode="tel" pattern="[0-9]{9,11}"></label><label class="wide">Email<input required type="email" name="email"></label><label class="wide"><span data-i18n="address">Địa chỉ</span><input required name="address"></label><label><span data-i18n="city">Tỉnh / Thành phố</span><select required><option value="">Chọn khu vực</option><option>Hà Nội</option><option>TP. Hồ Chí Minh</option><option>Khánh Hòa</option><option>Khác</option></select></label><label><span data-i18n="note">Ghi chú</span><input name="note"></label></div><h3>2. <span data-i18n="payment">Phương thức thanh toán</span></h3><div class="payment-methods"><label><input type="radio" name="payment" value="momo" required><span class="pay-logo momo">M</span><span><b>MoMo</b><small>Ví điện tử MoMo</small></span></label><label><input type="radio" name="payment" value="vnpay"><span class="pay-logo vnpay">VN</span><span><b>VNPay</b><small>QR / ATM / Visa / MasterCard</small></span></label><label><input type="radio" name="payment" value="cod"><span class="pay-logo cod">₫</span><span><b>COD</b><small data-i18n="cod">Thanh toán khi nhận hàng</small></span></label></div><button class="button dark full" data-i18n="placeOrder">Xác nhận đặt hàng</button></form><aside class="order-summary"><h3 data-i18n="yourOrder">Đơn hàng của bạn</h3><div id="checkoutItems"></div><div class="summary-line"><span data-i18n="subtotal">Tạm tính</span><b id="subtotal">0₫</b></div><div class="summary-line"><span data-i18n="delivery">Giao hàng</span><b>Miễn phí</b></div><div class="summary-line total"><span data-i18n="total">Tổng cộng</span><b id="total">0₫</b></div></aside></div></main><div id="appFooter"></div><script src="../assets/js/app.js"></script></body></html>
